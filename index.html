<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f5f28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Maskiner v1.0</title>

<style>
/* Layout: one fixed full-screen stage. A canvas shows the farm from above (camera follows the machine, never rotates);
   task + progress bars on top, joystick bottom-left, GAS and BAK bottom-right, menus as panels over the farm. Single look by choice. */
:root{
  --grass:#3f7f34; --ink:#1d1a12; --panel:rgba(31,26,16,.94); --line:#6a5a37;
  --chalk:#fff8e8; --dim:#d4c49c; --wheat:#f2c14e; --wheat-dk:#8a6512;
  --gas:#38a548; --gas-dk:#1f6b2b; --bak:#e07a2c; --bak-dk:#8f4513; --barn:#c9392d;
  --f-disp:"Lilita One","Arial Black",Impact,sans-serif;
  --f-ui:"Signika","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--grass);color:var(--chalk);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);font-size:16px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;background:var(--grass)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:max(12px, calc(env(safe-area-inset-left,0px) + 10px));
  padding-right:max(12px, calc(env(safe-area-inset-right,0px) + 10px));
  display:flex;align-items:flex-start;gap:10px}
.hudbox{flex:1;min-width:0;background:rgba(24,20,12,.72);border:1px solid rgba(255,248,232,.18);border-radius:14px;padding:7px 11px 9px;display:flex;flex-direction:column;gap:6px;max-width:440px}
.task{font-family:var(--f-disp);font-size:19px;letter-spacing:.02em;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.meter{display:grid;grid-template-columns:76px minmax(0,1fr) 46px;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--dim)}
.meter b{color:var(--chalk);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffe08a,var(--wheat));border-radius:6px}
.bar.tank i{background:linear-gradient(#9fe08b,#4caf3c)}
.bar.tank.full i{background:linear-gradient(#ffb0a4,#e0473a);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
#pause{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(24,20,12,.72);display:grid;place-items:center}
#pause svg{width:18px;height:18px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);max-width:calc(100% - 32px);
  background:rgba(24,20,12,.86);border:2px solid var(--wheat);border-radius:14px;padding:8px 14px;font-weight:700;font-size:16px;text-align:center;
  pointer-events:none;opacity:0;transition:opacity .25s;text-wrap:balance}
#toast.on{opacity:1}

/* Controls */
.ctrl{position:absolute;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px, calc(env(safe-area-inset-left,0px) + 12px));
  padding-right:max(16px, calc(env(safe-area-inset-right,0px) + 12px))}
#joy{pointer-events:auto;width:122px;height:122px;border-radius:50%;position:relative;touch-action:none;flex:none;
  background:radial-gradient(circle,rgba(0,0,0,.18) 0 40%,rgba(0,0,0,.34) 70%);border:3px solid rgba(255,248,232,.6);box-shadow:0 4px 14px rgba(0,0,0,.3)}
#joy::before,#joy::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,248,232,.25);border-radius:2px}
#joy::before{width:70%;height:3px;transform:translate(-50%,-50%)}
#joy::after{width:3px;height:70%;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--wheat) 55%,#b88a1c);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
.pedals{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.pedal{border:0;border-radius:22px;color:#fff;font-family:var(--f-disp);letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .05s}
.pedal svg{width:30px;height:30px}
#bak{width:80px;height:84px;background:var(--bak);box-shadow:0 6px 0 var(--bak-dk);font-size:19px}
#gas{width:98px;height:118px;background:var(--gas);box-shadow:0 6px 0 var(--gas-dk);font-size:26px}
.pedal.on{transform:translateY(5px)}
#bak.on{box-shadow:0 1px 0 var(--bak-dk);filter:brightness(1.12)}
#gas.on{box-shadow:0 1px 0 var(--gas-dk);filter:brightness(1.12)}

/* Screens */
.screen{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(20,16,8,.25),rgba(20,16,8,.65))}
.panel{width:min(100%,620px);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:52px;line-height:.95;color:var(--wheat);text-shadow:0 4px 0 var(--wheat-dk);letter-spacing:.01em;text-wrap:balance}
.sub{margin:8px 0 14px;color:var(--dim);font-weight:600;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.card{display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:12px;align-items:center;text-align:left;
  border:2px solid rgba(255,248,232,.14);border-radius:16px;background:rgba(255,248,232,.06);padding:8px;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--wheat);background:rgba(242,193,78,.12)}
.card canvas{grid-row:1/4;width:92px;height:92px;border-radius:12px;display:block}
.card b{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.05;color:var(--chalk)}
.card span{font-size:15px;font-weight:600;color:var(--dim)}
.card em{font-style:normal;font-size:13px;font-weight:700;color:var(--wheat);align-self:start;min-height:1em}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.chip{border:1px solid rgba(255,248,232,.3);background:rgba(255,248,232,.08);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.ver{color:var(--dim);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.panel.small{width:min(100%,360px);text-align:center}
.panel.small h2{margin:0 0 6px;font-family:var(--f-disp);font-weight:400;font-size:38px;color:var(--wheat);text-shadow:0 3px 0 var(--wheat-dk)}
.panel.small p{margin:0 0 14px;color:var(--dim);font-weight:600;font-size:16px;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:10px}
.big{border:0;border-radius:16px;padding:14px;font-family:var(--f-disp);font-size:22px;background:var(--gas);color:#fff;box-shadow:0 5px 0 var(--gas-dk);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big.alt{background:#5b5040;box-shadow:0 5px 0 #2f2920}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gas-dk)}
.stars{font-size:40px;letter-spacing:6px;color:var(--wheat);margin:2px 0 6px;text-shadow:0 3px 0 var(--wheat-dk)}
@media (max-height:520px) and (orientation:landscape){h1{font-size:38px}.sub{margin:4px 0 10px}.card canvas{width:70px;height:70px}.card{grid-template-columns:70px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.bar.tank.full i{animation:none}}
</style>
</head>
<body>


<div id="stage">
  <canvas id="c" aria-label="Gården set oppefra"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hudbox">
      <div class="task" id="task">Høst kornet</div>
      <div class="meter"><span id="pLab">Høstet</span><div class="bar"><i id="pBar"></i></div><b id="pVal">0%</b></div>
      <div class="meter" id="tRow"><span id="tLab">Korntank</span><div class="bar tank" id="tBox"><i id="tBar"></i></div><b id="tVal"></b></div>
    </div>
    <button id="pause" aria-label="Pause"><svg viewBox="0 0 18 18" fill="#fff8e8"><rect x="3" y="2" width="4" height="14" rx="1.2"/><rect x="11" y="2" width="4" height="14" rx="1.2"/></svg></button>
  </div>
  <div id="toast" role="status"></div>

  <div class="ctrl" id="ctrl" hidden>
    <div id="joy" aria-label="Joystick til at styre"><div id="knob"></div></div>
    <div class="pedals">
      <button class="pedal" id="bak" aria-label="Bak"><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v18M7 16l8 8 8-8"/></svg>BAK</button>
      <button class="pedal" id="gas" aria-label="Gas"><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 24V6M7 14l8-8 8 8"/></svg>GAS</button>
    </div>
  </div>

  <section class="screen" id="menu">
    <div class="panel">
      <h1>Maskiner</h1>
      <p class="sub">Vælg en maskine og kom ud på marken</p>
      <div class="cards">
        <button class="card" data-m="combine"><canvas width="184" height="184"></canvas><b>Mejetærsker</b><span>Høst kornet</span><em></em></button>
        <button class="card" data-m="tractor"><canvas width="184" height="184"></canvas><b>Traktor</b><span>Pløj marken</span><em></em></button>
        <button class="card" data-m="loader"><canvas width="184" height="184"></canvas><b>Gummiged</b><span>Grav jorden</span><em></em></button>
      </div>
      <div class="foot"><button class="chip" id="snd">Lyd: til</button><span class="ver" id="ver"></span></div>
    </div>
  </section>

  <section class="screen" id="pauseScr" hidden>
    <div class="panel small">
      <h2>Pause</h2>
      <div class="stack">
        <button class="big" id="resume">Kør videre</button>
        <button class="big alt" id="restart">Start forfra</button>
        <button class="big alt" id="toMenu">Vælg maskine</button>
      </div>
    </div>
  </section>

  <section class="screen" id="winScr" hidden>
    <div class="panel small">
      <div class="stars">★★★</div>
      <h2>Flot klaret!</h2>
      <p id="winTxt"></p>
      <div class="stack">
        <button class="big" id="again">Kør igen</button>
        <button class="big alt" id="winMenu">Vælg maskine</button>
      </div>
    </div>
  </section>
</div>

<script>
const VERSION='v1.0';
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function inRect(x,y,r,m){return x>r.x-m&&x<r.x+r.w+m&&y>r.y-m&&y<r.y+r.h+m}
$('#ver').textContent=VERSION;

/* ---------- screen ---------- */
let W=0,H=0,DPR=1,SC=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);SC=Math.min(W,H)/330}
addEventListener('resize',resize);resize();

/* ---------- the farm ---------- */
const WORLD={w:1700,h:1300};
const FA={x:640,y:120,w:660,h:440};   // kornmark
const FB={x:640,y:690,w:660,h:480};   // pløjemark
const PIT={x:130,y:720,w:336,h:400};  // grusgrav
const ROADS=[{x:0,y:600,w:1700,h:40},{x:540,y:0,w:40,h:1300}];
const YARD={x:110,y:110,w:410,h:390};
const HOUSE={x:150,y:150,w:120,h:86},BARN={x:300,y:140,w:170,h:120};
const SILOS=[{x:488,y:316,r:24},{x:488,y:378,r:20}];
const BALES=[[172,318],[200,332],[228,318],[184,356],[214,370]].map(([x,y])=>({x,y,r:11}));
const POND={x:1500,y:905,rx:104,ry:68};
const TRAILER={x:604,y:372,a:-Math.PI/2};
const PARK={combine:{x:206,y:448,a:-Math.PI/2},tractor:{x:316,y:440,a:-Math.PI/2},loader:{x:420,y:446,a:-Math.PI/2}};
const START={combine:{x:720,y:618,a:-Math.PI/2},tractor:{x:720,y:622,a:Math.PI/2},loader:{x:360,y:620,a:Math.PI/2}};

const TREES=[];
(function(){const r=rng(11);
  const free=(x,y,m)=>{if(x<22||y<22||x>WORLD.w-22||y>WORLD.h-22)return false;
    for(const q of [FA,FB,PIT,YARD,...ROADS])if(inRect(x,y,q,m))return false;
    if(((x-POND.x)/(POND.rx+m))**2+((y-POND.y)/(POND.ry+m))**2<1)return false;
    for(const t of TREES)if(hyp(t.x-x,t.y-y)<t.r+18)return false;return true};
  const add=(x,y,m)=>{if(free(x,y,m))TREES.push({x,y,r:15+r()*9,v:(r()*3)|0})};
  for(let x=30;x<WORLD.w;x+=44){add(x+r()*12-6,34+r()*12,18);add(x+r()*12-6,WORLD.h-34-r()*12,18)}
  for(let y=80;y<WORLD.h-60;y+=44){add(36+r()*12,y+r()*12,18);add(WORLD.w-36-r()*12,y+r()*12,18)}
  for(let i=0;i<900&&TREES.length<150;i++)add(r()*WORLD.w,r()*WORLD.h,34);
})();

/* static colliders */
const CIRC=[...SILOS,...BALES,...TREES.map(t=>({x:t.x,y:t.y,r:t.r*.62})),{x:POND.x-48,y:POND.y,r:58},{x:POND.x+48,y:POND.y,r:58},{x:POND.x,y:POND.y,r:62}];
const RECTS=[HOUSE,BARN];

/* ---------- textures ---------- */
function pat(size,fn){const c=mkCanvas(size,size),o=c.getContext('2d');fn(o,size);return ctx.createPattern(c,'repeat')}
const GRASS=pat(256,(o,s)=>{const r=rng(3);o.fillStyle='#4b8a3b';o.fillRect(0,0,s,s);
  for(let i=0;i<1100;i++){o.fillStyle=r()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.06)';o.fillRect(r()*s,r()*s,3,3)}
  for(let i=0;i<34;i++){o.fillStyle=['#f6e27a','#ffffff','#f3a6c8'][i%3];o.fillRect(r()*s,r()*s,2,2)}});
const GRAVEL=pat(64,(o,s)=>{const r=rng(5);o.fillStyle='#c0a87c';o.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){o.fillStyle=r()<.5?'rgba(110,85,50,.3)':'rgba(255,245,220,.3)';o.fillRect(r()*s,r()*s,2,2)}});
const WATER=pat(128,(o,s)=>{const r=rng(9);o.fillStyle='#3b84b8';o.fillRect(0,0,s,s);
  o.strokeStyle='rgba(255,255,255,.18)';o.lineWidth=1.5;for(let i=0;i<14;i++){const x=r()*s,y=r()*s;o.beginPath();o.moveTo(x,y);o.quadraticCurveTo(x+6,y-3,x+12,y);o.stroke()}});

const TREE_SPR=[['#245a26','#3f8a36','#76bd55'],['#2d6630','#4f9a3f','#8fcf62'],['#1f4f2a','#356f3b','#5f9f58']].map(([a,b,d],v)=>{
  const s=96,c=mkCanvas(s,s),o=c.getContext('2d'),r=rng(20+v);
  const blobs=[[48,48,40]];for(let i=0;i<6;i++){const an=r()*TAU,dd=14+r()*10;blobs.push([48+Math.cos(an)*dd,48+Math.sin(an)*dd,18+r()*8])}
  for(const [x,y,rad] of blobs){o.fillStyle=a;o.beginPath();o.arc(x,y,rad,0,TAU);o.fill()}
  for(const [x,y,rad] of blobs){const g=o.createRadialGradient(x-rad*.35,y-rad*.4,rad*.1,x,y,rad);g.addColorStop(0,d);g.addColorStop(.6,b);g.addColorStop(1,'rgba(0,0,0,0)');o.fillStyle=g;o.beginPath();o.arc(x,y,rad*.92,0,TAU);o.fill()}
  return c});

/* ---------- fields (painted canvases + coverage grid) ---------- */
class Field{constructor(r,ts,k){Object.assign(this,r);this.ts=ts;this.k=k;this.cols=Math.ceil(r.w/ts);this.rows=Math.ceil(r.h/ts);this.n=this.cols*this.rows;
  this.s=new Uint8Array(this.n);this.done=0;this.c=mkCanvas(Math.round(r.w*k),Math.round(r.h*k));this.o=this.c.getContext('2d')}
  begin(){this.o.setTransform(this.k,0,0,this.k,-this.x*this.k,-this.y*this.k)}}
function paintWheat(f,seed){const o=f.o,r=rng(seed);f.begin();o.fillStyle='#d4a838';o.fillRect(f.x,f.y,f.w,f.h);
  for(let y=f.y;y<f.y+f.h;y+=5){o.fillStyle='rgba(120,80,10,.1)';o.fillRect(f.x,y,f.w,1)}
  for(let i=0;i<f.w*f.h/8;i++){o.fillStyle=r()<.55?'rgba(255,232,150,.55)':'rgba(140,92,16,.35)';o.fillRect(f.x+r()*f.w,f.y+r()*f.h,1.3,2.4)}
  for(let i=0;i<26;i++){const x=f.x+r()*f.w,y=f.y+r()*f.h,rad=40+r()*70,g=o.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(255,236,170,.16)');g.addColorStop(1,'rgba(255,236,170,0)');o.fillStyle=g;o.fillRect(x-rad,y-rad,rad*2,rad*2)}}
function paintStubbleField(f,seed){const o=f.o,r=rng(seed);f.begin();o.fillStyle='#c9b271';o.fillRect(f.x,f.y,f.w,f.h);
  for(let x=f.x;x<f.x+f.w;x+=4){o.fillStyle='rgba(120,95,40,.16)';o.fillRect(x,f.y,1,f.h)}
  for(let x=f.x+30;x<f.x+f.w;x+=66){o.fillStyle='rgba(240,222,160,.6)';o.fillRect(x-5,f.y,10,f.h)}

  if(G&&G.target&&scene==='play'){const t=G.target,pulse=(Math.sin(clock*5)+1)/2;
    if(t.r){c.strokeStyle=`rgba(255,215,90,${.55+pulse*.4})`;c.lineWidth=4;c.setLineDash([10,8]);c.lineDashOffset=-clock*30;c.beginPath();c.arc(t.x,t.y,t.r+pulse*6,0,TAU);c.stroke();c.setLineDash([])}
    const dx=t.x-P.x,dy=t.y-P.y,d=hyp(dx,dy);if(d>(t.r||0)+70){const a=Math.atan2(dy,dx),ax=P.x+Math.cos(a)*(52+pulse*6),ay=P.y+Math.sin(a)*(52+pulse*6);
      c.save();c.translate(ax,ay);c.rotate(a);c.fillStyle='#ffd65a';c.strokeStyle='#5a3d05';c.lineWidth=2.5;c.lineJoin='round';
      c.beginPath();c.moveTo(16,0);c.lineTo(-6,-13);c.lineTo(-2,0);c.lineTo(-6,13);c.closePath();c.stroke();c.fill();c.restore()}}
  // confetti (screen space)
  if(confetti.length){c.setTransform(DPR,0,0,DPR,0,0);for(const q of confetti){c.save();c.translate(q.x,q.y);c.rotate(q.r);c.fillStyle=q.c;c.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);c.restore()}}
}
function drawRoof(c,b,dk,lt,house){c.fillStyle='rgba(0,0,0,.3)';c.fillRect(b.x+10,b.y+12,b.w,b.h);
  c.fillStyle=lt;c.fillRect(b.x,b.y,b.w,b.h/2);c.fillStyle=dk;c.fillRect(b.x,b.y+b.h/2,b.w,b.h/2);
  c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;for(let x=b.x+6;x<b.x+b.w;x+=6){c.beginPath();c.moveTo(x,b.y);c.lineTo(x,b.y+b.h);c.stroke()}
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(b.x,b.y+b.h/2-1.5,b.w,3);
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=2;c.strokeRect(b.x,b.y,b.w,b.h);
  if(house){c.fillStyle='#8a4a3a';c.fillRect(b.x+b.w*.7,b.y+b.h*.18,10,12);c.fillStyle='#3a2a22';c.fillRect(b.x+b.w*.7+2,b.y+b.h*.18+2,6,8)}
  else{c.fillStyle='#e8e2d4';c.fillRect(b.x+b.w/2-14,b.y+b.h/2-4,28,8)}}

function fx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.grain){p.vx*=.96;p.vy*=.96}}
  if(parts.length>600)parts.splice(0,parts.length-600);
  for(let i=confetti.length-1;i>=0;i--){const q=confetti[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;q.vx+=Math.sin(clock*3+i)*20*dt;if(q.y>H+30)confetti.splice(i,1)}}

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(scene==='play'&&G&&!G.won)update(dt);
  else if(scene==='play'&&G&&G.won){P.v*=.9}
  if(scene==='menu'){cam.x=880+Math.sin(clock*.06)*420;cam.y=620+Math.cos(clock*.045)*300}
  fx(dt);render();audioTick();requestAnimationFrame(frame)}

/* ---------- menus ---------- */
function refreshMedals(){document.querySelectorAll('.card').forEach(b=>{const n=medals[b.dataset.m]||0;b.querySelector('em').textContent=n?('★ Klaret '+n+(n===1?' gang':' gange')):''})}
document.querySelectorAll('.card').forEach(b=>{const k=b.dataset.m,cn=b.querySelector('canvas'),o=cn.getContext('2d');
  const bg={combine:['#d6ab3c','#c9b06e'],tractor:['#c9b271','#6e4b2f'],loader:['#968c79','#86603b']}[k];
  o.fillStyle=bg[0];o.fillRect(0,0,184,184);o.fillStyle=bg[1];o.fillRect(0,92,184,92);
  o.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<184;y+=8)o.fillRect(0,y,184,2);
  o.setTransform(2.2,0,0,2.2,92,92);const sc={combine:1,tractor:1.15,loader:1.2}[k];o.scale(sc,sc);
  drawThing(o,k,k==='tractor'?10:k==='combine'?-2:2,0,-Math.PI/2,{steer:0,tank:k==='combine'?20:0,cap:30,bucket:k==='loader'?9:0,bcap:12,plowing:true});
  b.onclick=()=>{audioInit();startGame(k)}});
refreshMedals();
$('#pause').onclick=()=>show('pause');
$('#resume').onclick=()=>show('play');
$('#restart').onclick=()=>startGame(P.kind);
$('#toMenu').onclick=()=>{G=null;P=null;FIELDS=buildFields('menu');show('menu')};
$('#again').onclick=()=>startGame(P.kind);
$('#winMenu').onclick=()=>{G=null;P=null;FIELDS=buildFields('menu');show('menu')};
requestAnimationFrame(frame);
</script>
